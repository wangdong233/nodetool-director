name: Web TSC Gate

# Master-only (fork): the G2 error-set check from the i18n commit gate, run
# on a 16GB runner. The dev box cannot host the full-project tsc with the
# dev stack resident (measured live set 3.7-4GB; per-project chunking was
# refuted — docs/tsc-project-references-postmortem.md), so CI is the
# primary host and scripts/tsc-set-check.mjs is the shared contract: the
# identical comparator runs locally in a quiet window.
on:
  push:
    branches: [master, feat/i18n-zh]
    paths:
      - "web/**"
      - ".github/workflows/web-tsc-gate.yml"
  workflow_dispatch:

jobs:
  tsc-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      # Root install: web is a workspace, the compiler and the lockfile live
      # at the root. Packages whose exports map points at dist (audio-nodes,
      # image-nodes, node-sdk subpaths) need a build before their types
      # resolve — same shape as the upstream quality-checks typecheck leg
      # (npm ci && npm run build:packages).
      - name: Install toolchain
        run: npm ci --no-audit --no-fund
      - name: Build workspace packages
        run: npm run build:packages
      - name: Error-set check vs baseline
        working-directory: web
        run: |
          set +e
          OUT=$(node scripts/tsc-set-check.mjs 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            echo "::error::web tsc gate exit $CODE — $(echo "$OUT" | tail -c 700 | tr '\n' ' ')"
          fi
          exit $CODE
