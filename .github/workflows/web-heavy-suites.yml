name: Web Heavy Suites

# The timeline and sketch suites are the two heaviest jest runs in web/
# (~3,600 tests together, multi-GB RSS under runInBand) — the same class
# of memory load as the full type-check that the 8GB dev box cannot host,
# so the 16GB runner owns them. Local verification keeps the light suites
# (i18n contract, touched-area runs) and the spot-probe.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-heavy-suites.yml"
  workflow_dispatch:

jobs:
  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install toolchain
        run: npm ci --no-audit --no-fund
      - name: Build workspace packages
        run: npm run build:packages
      - name: Timeline suite
        working-directory: web
        run: npx jest src/components/timeline/ --silent --runInBand

  sketch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install toolchain
        run: npm ci --no-audit --no-fund
      - name: Build workspace packages
        run: npm run build:packages
      - name: Sketch suite
        working-directory: web
        run: npx jest src/components/sketch/ --silent --runInBand
